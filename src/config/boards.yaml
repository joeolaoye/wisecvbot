# WiseCV job-source boards (architecture doc §2.1)
# Add a board: one line, one PR. `token` is the company's slug on that ATS.
# Every entry below was verified live via `npm run boards:check` (Oct 2026).
# Companies move ATSs — run it yourself; dead boards land in dead_letters at
# ingest and never crash the run.
