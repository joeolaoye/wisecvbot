<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="WiseCV — a quiet agent for jobs that fit." />
    <title>WiseCV</title>
    <link rel="stylesheet" href="/styles.css?v=email-only" />
    <script src="/app.js?v=email-only" defer></script>
  </head>
  <body>
    <main class="shell">
      <header>
        <a class="brand" href="/" aria-label="WiseCV home"><span>Wise</span>CV</a>
        <button id="logout" class="quiet hidden" type="button">Sign out</button>
      </header>

      <section id="auth" class="auth-card" aria-labelledby="auth-title">
        <p class="eyebrow">Your job agent</p>
        <h1 id="auth-title">Let’s find work worth your time.</h1>
        <p id="auth-intro" class="intro">No password. We’ll email you a secure sign-in link.</p>
        <form id="email-form" class="auth-option hidden">
          <label for="email">Email address</label>
          <input
            id="email"
            type="email"
            autocomplete="email"
            inputmode="email"
            placeholder="you@example.com"
            required
          />
          <button type="submit">Continue with email</button>
        </form>
        <a
          id="telegram-chip"
          class="telegram-chip hidden"
          target="_blank"
          rel="noreferrer"
          aria-label="Use WiseCV on Telegram"
        >
          <span class="telegram-dot" aria-hidden="true"></span>
          You can also use WiseCV on Telegram — message the bot
          <span aria-hidden="true">↗</span>
        </a>
        <div id="verify" class="verify hidden">
          <p id="verify-copy"></p>
        </div>
        <p id="auth-error" class="error" role="alert"></p>
      </section>

      <section id="chat" class="chat hidden" aria-label="WiseBot chat">
        <div id="messages" class="messages" aria-live="polite"></div>
        <form id="composer" class="composer">
          <label class="upload" title="Upload CV">
            <span aria-hidden="true">＋</span><span class="sr-only">Upload CV</span>
            <input id="cv" type="file" accept=".pdf,.doc,.docx" />
          </label>
          <textarea
            id="message"
            rows="1"
            placeholder="Message WiseBot"
            aria-label="Message WiseBot"
          ></textarea>
          <button type="submit" aria-label="Send">Send</button>
        </form>
        <p id="chat-error" class="error" role="alert"></p>
      </section>
    </main>
  </body>
</html>
